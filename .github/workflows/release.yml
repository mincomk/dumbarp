name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (e.g. 0.2.0). Defaults to Cargo.toml version.'
        required: false

permissions:
  contents: write

jobs:
  build-deb:
    strategy:
      fail-fast: false
      matrix:
        package: [dumbarpd, dumbarp-gateway, dumbarp-routerd]
        arch:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            deb_arch: amd64
            musl_gcc: x86_64-linux-musl-gcc
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            deb_arch: arm64
            musl_gcc: aarch64-linux-musl-gcc
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="$(grep -m1 '^version' dumbarp-daemon/Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.package }} $V for ${{ matrix.arch.deb_arch }}"

      - name: Sync Cargo.toml version
        run: |
          for f in dumbarp-daemon/Cargo.toml dumbarp-gateway/Cargo.toml dumbarp-routerd/Cargo.toml dumbarp-routing/Cargo.toml dumbarp-api/Cargo.toml; do
            sed -i "0,/^version = .*/s//version = \"${{ steps.ver.outputs.version }}\"/" "$f"
            grep -m1 '^version' "$f"
          done

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          sudo ln -sf "$(command -v musl-gcc)" /usr/local/bin/${{ matrix.arch.musl_gcc }}

      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add ${{ matrix.arch.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.package }}-release-deb-${{ matrix.arch.deb_arch }}
          cache-on-failure: true

      - name: Install bpf-linker
        if: matrix.package == 'dumbarpd' || matrix.package == 'dumbarp-routerd'
        run: |
          which bpf-linker || cargo install bpf-linker --locked

      - name: Install cargo-deb
        run: |
          which cargo-deb || cargo install cargo-deb --locked

      - name: Build release binary (musl)
        run: cargo build -p ${{ matrix.package }} --release --target ${{ matrix.arch.target }}

      - name: Package .deb
        run: cargo deb -p ${{ matrix.package }} --no-build --target ${{ matrix.arch.target }}

      - name: Show artifact
        run: ls -lh target/${{ matrix.arch.target }}/debian/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ steps.ver.outputs.version }}-${{ matrix.arch.deb_arch }}-deb
          path: target/${{ matrix.arch.target }}/debian/${{ matrix.package }}_*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.arch.target }}/debian/${{ matrix.package }}_*.deb
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
