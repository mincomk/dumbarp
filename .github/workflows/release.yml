name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (e.g. 0.2.0). Defaults to Cargo.toml version.'
        required: false

permissions:
  contents: write

jobs:
  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="$(grep -m1 '^version' dumbarp-daemon/Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building dumbarpd $V for ${{ matrix.deb_arch }}"

      - name: Sync Cargo.toml version
        run: |
          sed -i "0,/^version = .*/s//version = \"${{ steps.ver.outputs.version }}\"/" dumbarp-daemon/Cargo.toml
          grep -m1 '^version' dumbarp-daemon/Cargo.toml

      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dumbarpd-release-deb-${{ matrix.deb_arch }}
          cache-on-failure: true

      - name: Install bpf-linker
        run: |
          which bpf-linker || cargo install bpf-linker --locked

      - name: Install cargo-deb
        run: |
          which cargo-deb || cargo install cargo-deb --locked

      - name: Build release binary (musl)
        run: cargo build -p dumbarpd --release --target ${{ matrix.target }}

      - name: Package .deb
        run: cargo deb -p dumbarpd --no-build --target ${{ matrix.target }}

      - name: Show artifact
        run: ls -lh target/${{ matrix.target }}/debian/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: dumbarpd-${{ steps.ver.outputs.version }}-${{ matrix.deb_arch }}-deb
          path: target/${{ matrix.target }}/debian/dumbarpd_*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/debian/dumbarpd_*.deb
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
