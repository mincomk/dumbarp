apiVersion: v1
kind: ServiceAccount
metadata:
  name: dumbarp-k8s
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dumbarp-k8s
rules:
  - apiGroups: ["cilium.io"]
    resources: ["ciliumloadbalancerippools"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dumbarp-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dumbarp-k8s
subjects:
  - kind: ServiceAccount
    name: dumbarp-k8s
    namespace: kube-system
