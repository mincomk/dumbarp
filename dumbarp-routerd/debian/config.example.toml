# /etc/dumbarp-routerd.toml — example
refresh_interval_secs = 30
# Hold on to the last-known daemon set for this many seconds when a fetch
# fails, so transient outages don't flap routes.
stale_after_secs      = 300

# Steer lease IPs on source address alone, dropping the fwmark term from the
# policy rules. Off by default: rules read `from <lease-ip> fwmark <id> lookup
# <table>`, and the mark is learned per-flow from the DSCP tag the daemon
# stamps. When that learning misses, the rule does not match and the packet
# leaves via the main table with a lease IP as its source. Turning this on
# removes that failure mode — the source IP already selects the table, so the
# mark carries no routing information. Check `[dscp].ifaces` first: a large
# `unmarked` counter in the reconcile log means the datapath is not attached
# where reply traffic arrives.
source_based_routing = false

# Set EITHER [gateway] or [[daemons]], not both.

# Preferred: learn the daemon list from a dumbarp-gateway that has [serve]
# enabled, so this router needs no per-daemon config at all.
[gateway]
endpoint   = "http://10.0.0.1:1029"
auth_token = "REPLACE_ME"
# Only needed where this router's interface naming differs from what the
# gateway advertises. Keyed by daemon name.
# [gateway.device_overrides]
# homelab = "eno1"

# Alternative: poll each daemon directly. The daemon's DSCP identity is still
# learned from /leases, not configured here.
# [[daemons]]
# name        = "homelab"
# endpoint    = "http://10.0.0.5:1028"
# auth_token  = "REPLACE_ME"
# nexthop     = "10.0.0.5"
# device      = "br0"

[dscp]
# Every interface the ingress program attaches to — both the daemon-facing
# links and the links where reply traffic enters this router. The program
# tells the two roles apart by packet content, so no per-iface role is needed.
ifaces    = []
# Size of the flow table. Fixed at load time; raise it for busy routers.
max_flows = 65536
